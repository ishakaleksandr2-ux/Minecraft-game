<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="blocker">
        <div id="instructions">
            <p style="font-size:36px">Click to play</p>
            <p>
                Move: WASD<br/>
                Jump: SPACE<br/>
                Look: MOUSE
            </p>
        </div>
    </div>
    <div id="hotbar">
        <div class="slot selected">1</div>
        <div class="slot">2</div>
        <div class="slot">3</div>
        <div class="slot">4</div>
        <div class="slot">5</div>
        <div class="slot">6</div>
        <div class="slot">7</div>
        <div class="slot">8</div>
        <div class="slot">9</div>
    </div>
    <div id="inventory-screen" class="hidden">
        <div id="crafting-table">
            <div class="crafting-grid">
                <div class="slot"></div><div class="slot"></div><div class="slot"></div>
                <div class="slot"></div><div class="slot"></div><div class="slot"></div>
                <div class="slot"></div><div class="slot"></div><div class="slot"></div>
            </div>
            <div class="crafting-arrow">➔</div>
            <div class="slot result"></div>
        </div>
        <div id="player-inventory">
            <!-- Player inventory slots will be generated here -->
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
